# Harness evals — per-PR, scoped to what actually changed.
#
# Three tiers, gated independently by evals/scripts/ci-detect.mjs:
#   - skill      → changed .claude/skills/<name>/**   → content tier, evals/skills/<name>
#   - agent      → changed .claude/agents/<name>.md   → tool tier,    evals/agents/<name>
#   - workflow   → any CLAUDE.md (root or per-package), any agent, or the eval engine itself
#                  → the systemic tier, evals/workflow/** (skill activation, subagent dispatch)
#
# A changed artifact with NO evals written for it is not a failure — ci-detect.mjs reports it
# under skipped_skills/skipped_agents and this workflow only logs "SKIP <name> (no evals)"
# instead of running (or failing) anything for it.
#
# All three tiers run on OpenRouter, never the Claude subscription, so PR runs never touch the
# maintainer's personal quota. Model choice is a config knob, not a UI surface — set once in the
# `detect` job's "Model config" step below (GitHub Actions has no cross-job way to read one
# top-level `env:` from another job's `env:` — the `env` context isn't available inside an `env:`
# key at all — so the models are computed as job OUTPUTS instead and every other job reads them
# via `needs.detect.outputs.*`):
#   - eval_model_skills    — skills content tier (no tools, judge thresholds ~0.6-0.7). Started on
#     deepseek/deepseek-chat (cheapest option evals/README.md verifies), but a real CI run missed
#     a judged practice (0.33 vs the 0.6 gate — failed to distinguish internal path-alias deps from
#     external npm ones). google/gemini-2.5-flash instead, for the same reliability reason as
#     eval_model_agents below.
#   - eval_model_agents    — agents tool tier (own Read/Grep/Glob, no subagent dispatch), whose
#     quality cases demand exact output-format discipline: a verbatim quote of the offending line
#     per finding AND an explicit closing `## Gate verdict: PASS|FAIL`. deepseek then
#     gemini-2.5-flash both found the violations but kept dropping those two format practices, so
#     the cases stayed red. Moved the AGENT to anthropic/claude-haiku-4.5 (served natively by
#     OpenRouter's Anthropic Skin, works through the bundled LiteLLM proxy unchanged): a cheap
#     Anthropic model follows the output contract far more reliably. Paired with the agent-prompt
#     fix (the format rules are now mandatory in .claude/agents/architecture-reviewer*.md) and 0.7
#     thresholds. NOTE the JUDGE (eval_judge_model_agents) stays google/gemini-2.5-flash: haiku-4.5
#     as judge, called in OpenAI-chat format through the proxy, did not reliably emit the strict
#     `{"results":[...]}` verdict envelope llm-judge.ts requires ("judge JSON missing results[]"),
#     whereas gemini-flash judges that shape cleanly. So: agent = disciplined Anthropic output,
#     judge = reliable-JSON gemini. (The judge only needs to emit the verdict schema, not review.)
#   - eval_model_workflow  — the workflow tier's `dispatch` cases assert the model actually
#     invokes the Task/Agent tool to hand off to a subagent. Of the models evals/README.md
#     verifies, only google/gemini-2.5-flash reliably does that — deepseek and gpt-4.1-mini both
#     do the work inline instead of dispatching. This one is not a cost choice, it's a capability
#     requirement.
# To switch models repo-wide, edit the "Model config" step in the `detect` job — nothing else changes.
#
# Requires the repo secret OPENROUTER_API_KEY (Settings → Secrets and variables → Actions).
name: evals

on:
  pull_request:
    paths:
      - '.claude/**'
      - '**/CLAUDE.md'
      - 'evals/**'
      - '.github/workflows/evals.yml'

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

env:
  EVAL_BACKEND: openrouter

jobs:
  # Maps the PR's changed files onto which eval suites (if any) need to run, and which changed
  # artifacts have no evals at all (logged as SKIP further down, never failed). Also the single
  # source of truth for model choice (see the file-level comment above) — every other job reads
  # these back via needs.detect.outputs.*, since a job's env: block can't reference another env:
  # block directly.
  detect:
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.detect.outputs.skills }}
      agents: ${{ steps.detect.outputs.agents }}
      run_workflow: ${{ steps.detect.outputs.run_workflow }}
      skipped_skills: ${{ steps.detect.outputs.skipped_skills }}
      skipped_agents: ${{ steps.detect.outputs.skipped_agents }}
      eval_model_skills: ${{ steps.models.outputs.eval_model_skills }}
      eval_judge_model_skills: ${{ steps.models.outputs.eval_judge_model_skills }}
      eval_model_agents: ${{ steps.models.outputs.eval_model_agents }}
      eval_judge_model_agents: ${{ steps.models.outputs.eval_judge_model_agents }}
      eval_model_workflow: ${{ steps.models.outputs.eval_model_workflow }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Model config
        id: models
        run: |
          {
            echo "eval_model_skills=google/gemini-2.5-flash"
            echo "eval_judge_model_skills=google/gemini-2.5-flash"
            echo "eval_model_agents=anthropic/claude-haiku-4.5"
            echo "eval_judge_model_agents=google/gemini-2.5-flash"
            echo "eval_model_workflow=google/gemini-2.5-flash"
          } >> "$GITHUB_OUTPUT"

      - name: List changed files
        id: changed
        run: |
          {
            echo 'files<<EOF'
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Detect affected eval suites
        id: detect
        working-directory: evals
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: node scripts/ci-detect.mjs

  skills-evals:
    needs: detect
    if: needs.detect.outputs.skills != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJSON(needs.detect.outputs.skills) }}
    defaults:
      run:
        working-directory: evals
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      EVAL_MODEL: ${{ needs.detect.outputs.eval_model_skills }}
      EVAL_JUDGE_MODEL: ${{ needs.detect.outputs.eval_judge_model_skills }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Content tier: direct OpenAI-compatible call to OpenRouter, no proxy needed.
      - run: pnpm vitest run "skills/${{ matrix.skill }}"

  agents-evals:
    needs: detect
    if: needs.detect.outputs.agents != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Tool tier over OpenRouter is rate-limit-flaky under load (evals/README.md) — run agents
      # one at a time rather than all matrix legs hammering OpenRouter together.
      max-parallel: 1
      matrix:
        agent: ${{ fromJSON(needs.detect.outputs.agents) }}
    defaults:
      run:
        working-directory: evals
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_BASE_URL: http://localhost:4000
      EVAL_MODEL: ${{ needs.detect.outputs.eval_model_agents }}
      EVAL_JUDGE_MODEL: ${{ needs.detect.outputs.eval_judge_model_agents }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Tool tier: agentTask runs inside the Claude Agent SDK, which only speaks the Anthropic
      # wire protocol — the LiteLLM proxy translates that to the OpenRouter model above.
      - run: docker compose -f proxy/docker-compose.yml up -d
      - run: pnpm proxy:wait
      - run: pnpm vitest run "agents/${{ matrix.agent }}"
      - if: failure()
        run: docker compose -f proxy/docker-compose.yml logs --tail 100
      - if: always()
        run: docker compose -f proxy/docker-compose.yml down

  workflow-evals:
    needs: detect
    if: needs.detect.outputs.run_workflow == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evals
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_BASE_URL: http://localhost:4000
      EVAL_MODEL: ${{ needs.detect.outputs.eval_model_workflow }}
      EVAL_JUDGE_MODEL: ${{ needs.detect.outputs.eval_model_workflow }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f proxy/docker-compose.yml up -d
      - run: pnpm proxy:wait
      - run: pnpm eval:workflow
      - if: failure()
        run: docker compose -f proxy/docker-compose.yml logs --tail 100
      - if: always()
        run: docker compose -f proxy/docker-compose.yml down

  # Always runs (even if every tier above was skipped) so a PR that only touches artifacts
  # without evals gets a clear, green, non-mysterious summary instead of an empty check list.
  summary:
    needs: [detect, skills-evals, agents-evals, workflow-evals]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        env:
          SKILLS: ${{ needs.detect.outputs.skills }}
          AGENTS: ${{ needs.detect.outputs.agents }}
          RUN_WORKFLOW: ${{ needs.detect.outputs.run_workflow }}
          SKIPPED_SKILLS: ${{ needs.detect.outputs.skipped_skills }}
          SKIPPED_AGENTS: ${{ needs.detect.outputs.skipped_agents }}
        run: |
          {
            echo "### Harness evals"
            echo "- skills run: ${SKILLS}"
            echo "- agents run: ${AGENTS}"
            echo "- workflow tier: ${RUN_WORKFLOW}"
            [ -n "$SKIPPED_SKILLS" ] && echo "- SKIP skills (no evals written): ${SKIPPED_SKILLS}"
            [ -n "$SKIPPED_AGENTS" ] && echo "- SKIP agents (no evals written): ${SKIPPED_AGENTS}"
            true
          } >> "$GITHUB_STEP_SUMMARY"
